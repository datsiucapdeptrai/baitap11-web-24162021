<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<header th:fragment="header">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand"
               th:href="@{/}">
                Product Management
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Mở menu">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse"
                 id="mainNavbar">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/}">
                            Trang chủ
                        </a>
                    </li>

                    <!-- ===== MENU CHO ADMIN ===== -->
                    <li class="nav-item"
                        sec:authorize="hasRole('ADMIN')">

                        <a class="nav-link"
                           th:href="@{/products}">
                            Sản phẩm
                        </a>
                    </li>

                    <li class="nav-item"
                        sec:authorize="hasRole('ADMIN')">

                        <a class="nav-link"
                           th:href="@{/categories}">
                            Danh mục
                        </a>
                    </li>

                    <li class="nav-item"
                        sec:authorize="hasRole('ADMIN')">

                        <a class="nav-link"
                           th:href="@{/graphiql}">
                            GraphiQL
                        </a>
                    </li>

                    <!-- ===== MENU CHO USER: Giỏ hàng + Đơn hàng ===== -->
                    <li class="nav-item"
                        sec:authorize="hasRole('USER')">

                        <a class="nav-link"
                           th:href="@{/cart}">
                            🛒 Giỏ hàng
                        </a>
                    </li>

                    <li class="nav-item"
                        sec:authorize="hasRole('USER')">

                        <a class="nav-link"
                           th:href="@{/orders/history}">
                            📦 Đơn hàng của tôi
                        </a>
                    </li>

                </ul>

                <div class="d-flex align-items-center gap-3"
                     sec:authorize="isAuthenticated()">

                    <div class="text-white">
                        Xin chào,

                        <strong sec:authentication=
                                "principal.fullName">
                            Người dùng
                        </strong>
                    </div>

                    <form method="post"
                          th:action="@{/logout}"
                          class="m-0">

                        <button type="submit"
                                class="btn btn-outline-light btn-sm">
                            Đăng xuất
                        </button>
                    </form>

                </div>

            </div>
        </div>
    </nav>

</header>

</body>
</html>
