<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - Product Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: #f4f6f9;
        }

        .auth-card {
            max-width: 450px;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .1);
        }
    </style>
</head>
<body>
<main class="container py-4">
    <div class="card auth-card mx-auto">
        <div class="card-body p-4 p-md-5">
            <h2 class="fw-bold text-center mb-2">Quên mật khẩu</h2>

            <p class="text-secondary text-center mb-4">
                Nhập email đã đăng ký để nhận mã đặt lại mật khẩu.
            </p>

            <div class="alert alert-danger"
                 th:if="${error != null}"
                 th:text="${error}">
            </div>

            <form method="post" th:action="@{/forgot-password}">
                <div class="mb-4">
                    <label for="email" class="form-label">
                        Email đăng ký
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           th:value="${email}"
                           placeholder="Nhập email của bạn"
                           autocomplete="email"
                           required
                           autofocus>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Gửi mã OTP
                </button>
            </form>

            <div class="text-center mt-4">
                <a th:href="@{/login}">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
