<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu - Product Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: #f4f6f9;
        }

        .auth-card {
            max-width: 450px;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .1);
        }
    </style>
</head>
<body>
<main class="container py-4">
    <div class="card auth-card mx-auto">
        <div class="card-body p-4 p-md-5">
            <h2 class="fw-bold text-center mb-2">
                Đặt lại mật khẩu
            </h2>

            <p class="text-secondary text-center mb-4">
                Nhập mã OTP trong email và mật khẩu mới.
            </p>

            <div class="alert alert-success"
                 th:if="${success != null}"
                 th:text="${success}">
            </div>

            <div class="alert alert-danger"
                 th:if="${error != null}"
                 th:text="${error}">
            </div>

            <form method="post" th:action="@{/reset-password}">
                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email đăng ký
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           th:value="${email}"
                           autocomplete="email"
                           required>
                </div>

                <div class="mb-3">
                    <label for="otp" class="form-label">
                        Mã OTP
                    </label>

                    <input type="text"
                           id="otp"
                           name="otp"
                           class="form-control"
                           placeholder="Nhập 6 chữ số"
                           inputmode="numeric"
                           autocomplete="one-time-code"
                           maxlength="6"
                           pattern="[0-9]{6}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="newPassword" class="form-label">
                        Mật khẩu mới
                    </label>

                    <input type="password"
                           id="newPassword"
                           name="newPassword"
                           class="form-control"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">
                        Xác nhận mật khẩu mới
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           class="form-control"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Đổi mật khẩu
                </button>
            </form>

            <div class="text-center mt-4">
                <a th:href="@{/forgot-password}">
                    Gửi lại mã OTP
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
