<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Đăng nhập - Product Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .login-title {
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card login-card mx-auto">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <h2 class="login-title">
                    Product Management
                </h2>

                <p class="text-secondary mb-0">
                    Đăng nhập vào hệ thống
                </p>

            </div>

            <!-- Đăng nhập thất bại -->
            <div class="alert alert-danger"
                 th:if="${param.error}">

                Username, email hoặc mật khẩu không đúng.
            </div>

            <!-- Đăng xuất thành công -->
            <div class="alert alert-success"
                 th:if="${param.logout}">

                Bạn đã đăng xuất thành công.
            </div>

            <!-- Đăng ký thành công -->
            <div class="alert alert-success"
                 th:if="${param.registered}">

                Đăng ký tài khoản thành công.
                Bạn có thể đăng nhập.
            </div>

            <form method="post"
                  th:action="@{/login}">

                <div class="mb-3">

                    <label for="login"
                           class="form-label">

                        Username hoặc email
                    </label>

                    <input type="text"
                           id="login"
                           name="login"
                           class="form-control"
                           placeholder="Nhập username hoặc email"
                           autocomplete="username"
                           required
                           autofocus>

                </div>

                <div class="mb-3">

                    <label for="password"
                           class="form-label">

                        Mật khẩu
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Nhập mật khẩu"
                           autocomplete="current-password"
                           required>

                </div>

                <div class="form-check mb-4">

                    <input type="checkbox"
                           id="rememberMe"
                           name="remember-me"
                           class="form-check-input">

                    <label for="rememberMe"
                           class="form-check-label">

                        Ghi nhớ đăng nhập
                    </label>

                </div>
                <div class="text-end mb-3">
				    <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
				</div>

                <button type="submit"
                        class="btn btn-primary w-100">

                    Đăng nhập
                </button>

            </form>

            <div class="text-center mt-4">

                <span class="text-secondary">
                    Chưa có tài khoản?
                </span>

                <a th:href="@{/register}"
                   class="text-decoration-none fw-semibold">

                    Đăng ký ngay
                </a>

            </div>

        </div>
    </div>

</div>

</body>
</html>
