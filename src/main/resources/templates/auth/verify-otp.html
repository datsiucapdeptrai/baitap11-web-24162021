<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác thực tài khoản - Product Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: #f4f6f9;
        }

        .verify-card {
            max-width: 450px;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .1);
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="card verify-card mx-auto">
        <div class="card-body p-4 p-md-5">
            <h2 class="fw-bold text-center mb-2">Xác thực tài khoản</h2>
            <p class="text-secondary text-center mb-4">
                Nhập mã OTP được gửi đến email đăng ký của bạn.
            </p>

            <div class="alert alert-danger"
                 th:if="${error != null or errorMessage != null}"
                 th:text="${error != null ? error : errorMessage}">
            </div>

            <div class="alert alert-success"
                 th:if="${success != null}"
                 th:text="${success}">
            </div>

            <form method="post" th:action="@{/verify-otp}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email đăng ký</label>
                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           th:value="${email}"
                           placeholder="Nhập email bạn đã đăng ký"
                           autocomplete="email"
                           required>
                </div>

                <div class="mb-4">
                    <label for="otp" class="form-label">Mã OTP</label>
                    <input type="text"
                           id="otp"
                           name="otp"
                           class="form-control"
                           placeholder="Nhập 6 chữ số"
                           inputmode="numeric"
                           autocomplete="one-time-code"
                           maxlength="6"
                           pattern="[0-9]{6}"
                           required>
                    <div class="form-text">Mã có hiệu lực trong 5 phút.</div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Xác thực
                </button>

                <button type="submit"
                        th:formaction="@{/resend-otp}"
                        formnovalidate
                        class="btn btn-outline-secondary w-100 mt-3">
                    Gửi lại mã OTP
                </button>
            </form>

            <div class="text-center mt-4">
                <a th:href="@{/login}">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
