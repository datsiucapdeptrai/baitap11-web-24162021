<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - Product Management</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }
        .register-card {
            width: 100%;
            max-width: 520px;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card register-card mx-auto">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Đăng ký tài khoản</h2>
                <p class="text-secondary mb-0">Tạo tài khoản người dùng mới</p>
            </div>

            <div class="alert alert-danger"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">
            </div>

            <form method="post" th:action="@{/register}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username"
                           class="form-control" required maxlength="50"
                           th:value="${registerRequest.username}">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email"
                           class="form-control" required maxlength="150"
                           th:value="${registerRequest.email}">
                </div>

                <div class="mb-3">
                    <label for="fullName" class="form-label">Họ và tên</label>
                    <input type="text" id="fullName" name="fullName"
                           class="form-control" required
                           th:value="${registerRequest.fullName}">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" id="password" name="password"
                           class="form-control" required>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">
                        Nhập lại mật khẩu
                    </label>
                    <input type="password" id="confirmPassword"
                           name="confirmPassword"
                           class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Đăng ký
                </button>

                <div class="text-center mt-3">
                    Đã có tài khoản?
                    <a th:href="@{/login}">Đăng nhập</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
