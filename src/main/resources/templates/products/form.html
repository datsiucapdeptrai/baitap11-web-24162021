<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <meta charset="UTF-8">

    <title th:text="${formTitle}">
        Sản phẩm
    </title>
</head>

<body>

<section layout:fragment="content">

    <div class="card shadow-sm">

        <div class="card-body">

            <h2 class="mb-4"
                th:text="${formTitle}">
                Sản phẩm
            </h2>

            <!-- Thông báo thành công -->
            <div class="alert alert-success"
                 th:if="${success}"
                 th:text="${success}">
            </div>

            <!-- Thông báo lỗi -->
            <div class="alert alert-danger"
                 th:if="${error}"
                 th:text="${error}">
            </div>

            <!-- Danh sách ảnh hiện tại -->
            <div class="mb-4"
                 th:if="${product.images != null
                    and !product.images.isEmpty()}">

                <h5 class="mb-3">
                    Hình ảnh hiện tại
                </h5>

                <div class="d-flex gap-3 flex-wrap">

                    <div class="card"
                         style="width: 170px;"
                         th:each="image : ${product.images}">

                        <img class="card-img-top"
                             th:src="@{'/uploads/products/'
                                + ${image.imageUrl}}"
                             th:alt="${product.name}"
                             style="
                                width: 168px;
                                height: 160px;
                                object-fit: cover;
                             ">

                        <div class="card-body p-2 text-center">

                            <div class="mb-2"
                                 th:if="${image.primary}">

                                <span class="badge bg-success">
                                    Ảnh chính
                                </span>
                            </div>

                            <form method="post"
                                  th:action="@{/products/image/delete/{imageId}
                                    (imageId=${image.id})}">

                                <button type="submit"
                                        class="btn btn-danger btn-sm"
                                        onclick="return confirm(
                                            'Bạn có chắc muốn xóa ảnh này?'
                                        )">
                                    Xóa ảnh
                                </button>

                            </form>

                        </div>
                    </div>

                </div>
            </div>

            <!-- Form thêm/sửa sản phẩm -->
            <form method="post"
                  enctype="multipart/form-data"
                  th:object="${product}"
                  th:action="${product.id == null}
                    ? @{/products/create}
                    : @{/products/edit/{id}(id=${product.id})}">

                <input type="hidden"
                       th:field="*{id}">

                <!-- Tên sản phẩm -->
                <div class="mb-3">

                    <label class="form-label">
                        Tên sản phẩm
                    </label>

                    <input type="text"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')}
                                ? 'is-invalid'"
                           th:field="*{name}">

                    <div class="invalid-feedback"
                         th:errors="*{name}">
                    </div>

                </div>

                <!-- Giá -->
                <div class="mb-3">

                    <label class="form-label">
                        Giá
                    </label>

                    <input type="number"
                           step="0.01"
                           min="0"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('price')}
                                ? 'is-invalid'"
                           th:field="*{price}">

                    <div class="invalid-feedback"
                         th:errors="*{price}">
                    </div>

                </div>

                <!-- Số lượng -->
                <div class="mb-3">

                    <label class="form-label">
                        Số lượng
                    </label>

                    <input type="number"
                           min="0"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('quantity')}
                                ? 'is-invalid'"
                           th:field="*{quantity}">

                    <div class="invalid-feedback"
                         th:errors="*{quantity}">
                    </div>

                </div>

                <!-- Mô tả -->
                <div class="mb-3">

                    <label class="form-label">
                        Mô tả
                    </label>

                    <textarea class="form-control"
                              rows="5"
                              th:classappend="${#fields.hasErrors('description')}
                                ? 'is-invalid'"
                              th:field="*{description}">
                    </textarea>

                    <div class="invalid-feedback"
                         th:errors="*{description}">
                    </div>

                </div>

                <!-- Upload nhiều ảnh -->
                <div class="mb-3">

                    <label class="form-label">
                        Chọn hình ảnh sản phẩm
                    </label>

                    <input type="file"
                           class="form-control"
                           name="imageFiles"
                           multiple
                           accept=".jpg,.jpeg,.png,.webp,image/*">

                    <div class="form-text">
                        Có thể chọn nhiều ảnh. Chấp nhận JPG,
                        JPEG, PNG, WEBP; mỗi ảnh tối đa 5 MB.
                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Lưu
                </button>

                <a class="btn btn-secondary"
                   th:href="@{/products}">
                    Quay lại
                </a>

            </form>

        </div>

    </div>

</section>

</body>
</html>
