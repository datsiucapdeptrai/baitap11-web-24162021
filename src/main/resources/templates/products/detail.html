<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">
        Chi tiết sản phẩm
    </title>
</head>

<body>

<section layout:fragment="content">

    <div class="alert alert-success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <div class="alert alert-danger"
         th:if="${error}"
         th:text="${error}">
    </div>

    <div class="row">

        <div class="col-md-7">

            <h4>Hình ảnh sản phẩm</h4>

            <div class="row g-3"
                 th:if="${product.images != null
                    and !product.images.isEmpty()}">

                <div class="col-md-6"
                     th:each="image : ${product.images}">

                    <div class="card h-100">

                        <img class="card-img-top"
                             th:src="@{'/uploads/products/'
                                + ${image.imageUrl}}"
                             th:alt="${product.name}"
                             style="
                                height: 320px;
                                object-fit: cover;
                             ">

                        <div class="card-body text-center"
                             th:if="${image.primary}">

                            <span class="badge bg-success">
                                Ảnh chính
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="alert alert-warning"
                 th:if="${product.images == null
                    or product.images.isEmpty()}">
                Sản phẩm chưa có hình ảnh.
            </div>
        </div>

        <div class="col-md-5">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h2 th:text="${product.name}">
                    </h2>

                    <h4 class="text-danger">
                        <span th:text="${#numbers.formatDecimal(
                            product.price,
                            0,
                            'COMMA',
                            2,
                            'POINT'
                        )}">
                        </span> đ
                    </h4>

                    <p>
                        <strong>Số lượng còn:</strong>

                        <span th:text="${product.quantity}">
                        </span>
                    </p>

                    <p>
                        <strong>Mô tả:</strong>
                    </p>

                    <p th:text="${product.description}">
                    </p>

                    <!-- ====== FORM THÊM VÀO GIỎ HÀNG (chỉ USER) ====== -->
                    <div sec:authorize="hasRole('USER')"
                         th:if="${product.quantity > 0}">

                        <form th:action="@{/cart/add}"
                              method="post"
                              class="mt-3">

                            <input type="hidden"
                                   name="productId"
                                   th:value="${product.id}">

                            <div class="d-flex align-items-center mb-2">
                                <label class="me-2 mb-0">
                                    Số lượng:
                                </label>

                                <input type="number"
                                       name="quantity"
                                       value="1"
                                       min="1"
                                       th:max="${product.quantity}"
                                       class="form-control"
                                       style="width: 100px;">
                            </div>

                            <button type="submit"
                                    class="btn btn-success w-100">
                                🛒 Thêm vào giỏ hàng
                            </button>
                        </form>
                    </div>

                    <!-- Thông báo hết hàng -->
                    <div sec:authorize="hasRole('USER')"
                         th:if="${product.quantity <= 0}"
                         class="alert alert-warning mt-3">
                        Sản phẩm đã hết hàng
                    </div>

                    <!-- ====== NÚT CHỈNH SỬA (chỉ ADMIN) ====== -->
                    <a class="btn btn-warning mt-3"
                       sec:authorize="hasRole('ADMIN')"
                       th:href="@{/products/edit/{id}
                            (id=${product.id})}">
                        Chỉnh sửa
                    </a>

                    <a class="btn btn-secondary mt-3"
                       th:href="@{/}">
                        Quay lại
                    </a>

                </div>
            </div>
        </div>

    </div>

</section>

</body>
</html>
