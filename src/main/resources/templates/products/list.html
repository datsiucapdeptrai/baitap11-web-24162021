<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/layout}">

<head>
<meta charset="UTF-8">
<title>Quản lý sản phẩm</title>
</head>

<body>

	<section layout:fragment="content">

		<div
			class="d-flex justify-content-between
                align-items-center mb-4">

			<div>
				<h2 class="mb-1">Quản lý sản phẩm</h2>

				<p class="text-secondary mb-0">CRUD bằng AJAX và GraphQL</p>
			</div>

			<button type="button" id="btnAddProduct" class="btn btn-primary">
				+ Thêm sản phẩm</button>
		</div>

		<!-- Thông báo -->
		<div id="productAlert" class="alert d-none"></div>

		<!-- Tìm kiếm -->
		<form id="searchForm" class="row g-2 mb-4">

			<div class="col-md-4">
				<input type="text" id="searchKeyword" class="form-control"
					placeholder="Nhập tên sản phẩm">
			</div>

			<div class="col-md-3">
				<select id="categoryFilter" class="form-select">

					<option value="">Tất cả danh mục</option>
				</select>
			</div>

			<div class="col-md-2">
				<select id="pageSize" class="form-select">

					<option value="5">5 sản phẩm</option>

					<option value="10">10 sản phẩm</option>

					<option value="20">20 sản phẩm</option>
				</select>
			</div>

			<div class="col-md-3">
				<button type="submit" class="btn btn-success">Tìm kiếm</button>

				<button type="button" id="btnReset" class="btn btn-secondary">
					Làm mới</button>
			</div>
		</form>

		<!-- Loading -->
		<div id="productLoading" class="text-center py-4 d-none">

			<div class="spinner-border text-primary"></div>

			<div class="mt-2">Đang tải dữ liệu...</div>
		</div>

		<!-- Bảng sản phẩm -->
		<div class="table-responsive">

			<table
				class="table table-bordered
                      table-hover align-middle bg-white">

				<thead class="table-dark">
					<tr>
						<th>ID</th>
						<th>Tên sản phẩm</th>
						<th>Danh mục</th>
						<th>Giá</th>
						<th>Số lượng</th>
						<th>Mô tả</th>
						<th style="min-width: 220px;">Thao tác</th>
					</tr>
				</thead>

				<tbody id="productTableBody">
				</tbody>

			</table>
		</div>

		<div id="emptyMessage" class="alert alert-warning d-none">Không
			tìm thấy sản phẩm.</div>

		<!-- Phân trang -->
		<nav>
			<ul id="productPagination" class="pagination">
			</ul>
		</nav>

		<!-- Modal thêm/sửa sản phẩm -->
		<div class="modal fade" id="productModal" tabindex="-1"
			aria-hidden="true">

			<div class="modal-dialog modal-lg">

				<div class="modal-content">

					<form id="productForm">

						<div class="modal-header">

							<h5 id="productModalTitle" class="modal-title">Thêm sản phẩm
							</h5>

							<button type="button" class="btn-close" data-bs-dismiss="modal">
							</button>
						</div>

						<div class="modal-body">

							<input type="hidden" id="productId">

							<div id="modalError" class="alert alert-danger d-none"></div>

							<div class="mb-3">

								<label for="productName" class="form-label"> Tên sản
									phẩm </label> <input type="text" id="productName" class="form-control"
									maxlength="200" required>
							</div>

							<div class="row">

								<div class="col-md-6 mb-3">

									<label for="productPrice" class="form-label"> Giá </label> <input
										type="number" id="productPrice" class="form-control" min="0"
										step="0.01" required>
								</div>

								<div class="col-md-6 mb-3">

									<label for="productQuantity" class="form-label"> Số
										lượng </label> <input type="number" id="productQuantity"
										class="form-control" min="0" required>
								</div>
							</div>

							<div class="mb-3">

								<label for="productCategory" class="form-label"> Danh
									mục </label> <select id="productCategory" class="form-select" required>

									<option value="">-- Chọn danh mục --</option>
								</select>
							</div>

							<div class="mb-3">

								<label for="productDescription" class="form-label"> Mô
									tả </label>

								<textarea id="productDescription" class="form-control" rows="4"
									maxlength="1000">
                            </textarea>
							</div>

						</div>
						<div class="mb-3">

							<label for="productImages" class="form-label"> Hình ảnh
								sản phẩm </label> <input type="file" id="productImages"
								class="form-control" accept=".jpg,.jpeg,.png,.webp" multiple>

							<div class="form-text">Khi cập nhật và chọn ảnh mới, các
								ảnh cũ sẽ được thay thế. Mỗi ảnh tối đa 5 MB.</div>

						</div>

						<div id="existingImagesArea" class="mb-3 d-none">

							<label class="form-label"> Hình ảnh hiện tại </label>

							<div id="existingImages" class="d-flex flex-wrap gap-2"></div>

						</div>

						<div id="imagePreviewArea" class="mb-3 d-none">

							<label class="form-label"> Hình ảnh mới đã chọn </label>

							<div id="imagePreview" class="d-flex flex-wrap gap-2"></div>

						</div>
						<div class="modal-footer">

							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">Đóng</button>

							<button type="submit" id="btnSaveProduct" class="btn btn-primary">
								Lưu</button>
						</div>

					</form>
				</div>
			</div>
		</div>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
			
		</script>

		<script th:src="@{/js/graphql-client.js}"></script>
		<script th:src="@{/js/product.js}"></script>

	</section>

</body>
</html>
