<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Giỏ hàng của bạn</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered" th:if="${!cart.items.isEmpty()}">
        <thead>
        <tr>
            <th>Sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
            <th>Tổng</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cart.items}">
            <td th:text="${item.product.name}"></td>
            <td th:text="${item.product.price}"></td>
            <td>
                <form th:action="@{/cart/update}" method="post" class="d-flex">
                    <input type="hidden" name="itemId" th:value="${item.id}">
                    <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control form-control-sm me-2" style="width:80px">
                    <button type="submit" class="btn btn-sm btn-warning">Cập nhật</button>
                </form>
            </td>
            <td th:text="${item.product.price * item.quantity}"></td>
            <td>
                <form th:action="@{/cart/remove}" method="post">
                    <input type="hidden" name="itemId" th:value="${item.id}">
                    <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <h4 th:if="${!cart.items.isEmpty()}">Tổng cộng: <span th:text="${cart.totalPrice}"></span> VNĐ</h4>

    <div th:if="${cart.items.isEmpty()}" class="alert alert-info">Giỏ hàng trống</div>

    <a href="/" class="btn btn-secondary mt-3">Tiếp tục mua sắm</a>
    <a th:if="${!cart.items.isEmpty()}" href="/checkout" class="btn btn-primary mt-3">Thanh toán</a>
</div>
</body>
</html>
